version: '3.8'

services:
  mongodb:
    image: mongo
    container_name: mongodb_ex1
    ports:
      - "27017:27017"
    volumes:
      - mongo_data_ex1:/data/db

  api:
    build: .
    container_name: api_ex1
    ports:
      - "17000:17000"
    depends_on:
      - mongodb
    environment:
      - MONGO_URI=mongodb://mongodb:27017/jogostabuleiro

volumes:
  mongo_data_ex1: